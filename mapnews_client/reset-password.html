<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - MapNews</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/reset.css" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('mapnews_theme');
                var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark-theme');
                    document.addEventListener('DOMContentLoaded', function() {
                        if (document.body) document.body.classList.add('dark-theme');
                    });
                }
            } catch(e) {}
        })();
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-cont">

            <!-- STEP 1: Ввод email -->
            <form class="login-form" id="requestForm">
                <h2>Сброс пароля</h2>
                <p style="text-align:center; color: var(--color-gray-a6); font-size:14px; margin-bottom: 1.5rem;">
                    Введите email — мы отправим ссылку для смены пароля
                </p>
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" placeholder="example@mail.ru" required autocomplete="email">
                </div>
                <button type="submit" class="login-btn" id="requestBtn">Отправить ссылку</button>
                <div class="login-links" style="margin-top: 14px;">
                    <a href="/login" class="login-link">← Вернуться ко входу</a>
                </div>
                <div class="error-message" id="requestError"></div>
                <div class="success-message" id="requestSuccess" style="display:none; color: var(--color-green); text-align:center; margin-top:12px; font-size:14px;"></div>
            </form>

            <!-- STEP 2: Новый пароль (показывается когда в URL есть ?token=...) -->
            <form class="login-form" id="resetForm" style="display:none;">
                <h2>Новый пароль</h2>
                <p style="text-align:center; color: var(--color-gray-a6); font-size:14px; margin-bottom: 1.5rem;">
                    Придумайте новый пароль для вашего аккаунта
                </p>
                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="toggleNewPass" title="Показать/скрыть пароль" aria-label="Показать пароль">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Повторите пароль</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" id="toggleConfirmPass" title="Показать/скрыть пароль" aria-label="Показать пароль">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="resetBtn">Сохранить пароль</button>
                <div class="error-message" id="resetError"></div>
                <div class="success-message" id="resetSuccess" style="display:none; color: var(--color-green); text-align:center; margin-top:12px; font-size:14px;"></div>
            </form>

            <img src="./src/images/icons/logo.svg" alt="logo" class="logo-login">
        </div>
    </div>

    <script type="module">
        import { API_BASE } from './src/constants.js';

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        // Показываем нужный шаг
        if (token) {
            document.getElementById('requestForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'flex';
        }

        // Глазики
        function setupEye(btnId, inputEl) {
            const btn = document.getElementById(btnId);
            btn.addEventListener('click', () => {
                const isPass = inputEl.type === 'password';
                inputEl.type = isPass ? 'text' : 'password';
                btn.querySelector('.eye-open').style.display  = isPass ? 'none'  : '';
                btn.querySelector('.eye-closed').style.display = isPass ? '' : 'none';
            });
        }
        setupEye('toggleNewPass',     document.getElementById('newPassword'));
        setupEye('toggleConfirmPass', document.getElementById('confirmPassword'));

        // ── Шаг 1: запрос ссылки ─────────────────────────────────────
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn   = document.getElementById('requestBtn');
            const err   = document.getElementById('requestError');
            const ok    = document.getElementById('requestSuccess');
            const email = document.getElementById('resetEmail').value.trim();

            err.style.display = 'none';
            ok.style.display  = 'none';
            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const res  = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (!res.ok) {
                    err.textContent = data.message || 'Ошибка';
                    err.style.display = 'block';
                } else {
                    ok.textContent = data.message || 'Ссылка отправлена на вашу почту';
                    ok.style.display = 'block';
                    document.getElementById('requestForm').querySelector('button[type=submit]').disabled = true;
                }
            } catch {
                err.textContent = 'Не удалось связаться с сервером';
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить ссылку';
            }
        });

        // ── Шаг 2: смена пароля ───────────────────────────────────────
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn      = document.getElementById('resetBtn');
            const err      = document.getElementById('resetError');
            const ok       = document.getElementById('resetSuccess');
            const password = document.getElementById('newPassword').value;
            const confirm  = document.getElementById('confirmPassword').value;

            err.style.display = 'none';
            ok.style.display  = 'none';

            if (password !== confirm) {
                err.textContent = 'Пароли не совпадают';
                err.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Сохранение...';

            try {
                const res  = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    err.textContent = data.message || 'Ошибка';
                    err.style.display = 'block';
                } else {
                    ok.textContent = 'Пароль успешно изменён! Перенаправляем...';
                    ok.style.display = 'block';
                    setTimeout(() => window.location.href = '/login', 2000);
                }
            } catch {
                err.textContent = 'Не удалось связаться с сервером';
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Сохранить пароль';
            }
        });
    </script>
</body>
</html>
